info:
  name: Households
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/api/households"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body.length
      operator: eq
      value: "2"
    - expression: res.body[0].name
      operator: eq
      value: "Graça"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
