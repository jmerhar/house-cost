info:
  name: Services
  type: http
  seq: 26

http:
  method: GET
  url: "{{base_url}}/api/services"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].ends_on
      operator: eq
      value: "2026-12-11"
    - expression: res.body[0].notice_days
      operator: eq
      value: "30"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
