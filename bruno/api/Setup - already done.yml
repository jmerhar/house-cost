info:
  name: Setup - already done
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/setup"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.required
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
