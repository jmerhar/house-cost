info:
  name: Sessions
  type: http
  seq: 22

http:
  method: GET
  url: "{{base_url}}/api/auth/sessions"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].current
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
