info:
  name: Bills as CSV
  type: http
  seq: 18

http:
  method: GET
  url: "{{base_url}}/api/reports/bills.csv?year=2026"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "text/csv"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
