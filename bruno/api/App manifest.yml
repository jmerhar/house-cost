info:
  name: App manifest
  type: http
  seq: 31

http:
  method: GET
  url: "{{base_url}}/manifest.webmanifest"
  headers:
    - name: Accept-Language
      value: pt-PT

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "Despesas da casa"
    - expression: res.body.display
      operator: eq
      value: "standalone"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
