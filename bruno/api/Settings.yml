info:
  name: Settings
  type: http
  seq: 20

http:
  method: GET
  url: "{{base_url}}/api/settings"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.reconciliation_enabled
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
