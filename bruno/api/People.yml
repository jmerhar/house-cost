info:
  name: People
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/api/people"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].login
      operator: eq
      value: "lucia"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
