# Weekly updates, one grouped pull request per ecosystem. A pull request builds the image, so a
# dependency that breaks it fails there.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The interface. Nothing younger than two weeks, as frontend/.npmrc asks of npm.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # svelte-check names the TypeScript majors it supports as a peer dependency, so a new major
    # cannot install until svelte-check accepts it; move both by hand then.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns:
          - "*"

  # The backend's declared ranges; only a release outside one opens a pull request.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      backend:
        patterns:
          - "*"
